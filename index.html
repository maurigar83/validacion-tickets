<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Tickets</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 24px 16px 30px;
      background: #f5f5f5;
      color: #111827;
    }

    h1 {
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.15;
      margin: 10px auto 28px;
    }

    .acciones {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 58px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      font-size: clamp(17px, 4.5vw, 20px);
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    #btnStart {
      background: #198754;
      color: white;
    }

    #btnStop {
      background: #dc3545;
      color: white;
    }

    #btnPanel {
      background: #0d6efd;
      color: white;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 24px auto 0;
      background: white;
      border-radius: 12px;
      padding: 10px;
      overflow: hidden;
    }

    #mensaje {
      width: 100%;
      max-width: 420px;
      min-height: 28px;
      margin: 20px auto 0;
      font-size: clamp(17px, 4.5vw, 20px);
      font-weight: bold;
      line-height: 1.35;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px 24px;
      }

      h1 {
        margin-top: 8px;
        margin-bottom: 24px;
      }

      .acciones {
        max-width: 360px;
        gap: 10px;
      }

      button {
        min-height: 54px;
        border-radius: 11px;
      }

      #reader {
        max-width: 360px;
        margin-top: 20px;
        padding: 8px;
      }

      #mensaje {
        max-width: 360px;
        margin-top: 16px;
      }
    }

    @media (max-width: 360px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      h1 {
        font-size: 27px;
      }

      .acciones,
      #reader,
      #mensaje {
        max-width: 340px;
      }

      button {
        min-height: 50px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <h1>VALIDACIÓN DE TICKETS</h1>

  <div class="acciones">
    <button id="btnStart" type="button" onclick="iniciarEscaner()">
      ESCANEAR TICKET
    </button>

    <button id="btnStop" type="button" onclick="detenerEscaner()">
      DETENER CÁMARA
    </button>

    <button id="btnPanel" type="button" onclick="volverAlPanel()">
      ← VOLVER AL PANEL
    </button>
  </div>

  <div id="reader"></div>

  <div id="mensaje">Verificando acceso...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwA9i3d70UgR6wMiq_nAqeD_IPAqqV1yTGBmqHBUZbfCfh8W5-3UrKVlay5VRgB6P2rWw/exec";
    const SEGURIDAD_API_URL = "https://script.google.com/macros/s/AKfycbwITb6P7XOPAZpuRCmrLFitL2eK3-UBujqRuFMDgjUe1-YDXHNWCPUm4x0kUA8d82ZhLw/exec";
    const LOGIN_URL = "https://maurigar83.github.io/mg-eventos/index.html";
    const PANEL_URL = "https://maurigar83.github.io/mg-eventos/panel.html";
    const INTERVALO_REVALIDACION = 60 * 60 * 1000;

    let scanner = null;
    let procesando = false;
    let audioContext = null;
    let intervaloRevalidacion = null;

    function limpiarSesion() {
      sessionStorage.removeItem("mg_eventos_token");
      sessionStorage.removeItem("mg_eventos_usuario");
      sessionStorage.removeItem("mg_eventos_nombre");
      sessionStorage.removeItem("mg_eventos_rol");
      sessionStorage.removeItem("mg_eventos_permisos");
      sessionStorage.removeItem("mg_eventos_expira");
    }

    async function validarAcceso(revalidacion = false) {
      const mensaje = document.getElementById("mensaje");
      const token = sessionStorage.getItem("mg_eventos_token") || "";

      if (!token) {
        limpiarSesion();
        window.location.replace(LOGIN_URL);
        return false;
      }

      if (!revalidacion) {
        mensaje.innerText = "Verificando sesión...";
      }

      try {
        const respuesta = await fetch(SEGURIDAD_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            accion: "sesion",
            token: token
          })
        });

        const datos = await respuesta.json();

        if (!datos.ok || !datos.permisos || !datos.permisos.includes("LEER_QR")) {
          await manejarSesionInvalida();
          return false;
        }

        sessionStorage.setItem("mg_eventos_usuario", datos.usuario || "");
        sessionStorage.setItem("mg_eventos_nombre", datos.nombre || "");
        sessionStorage.setItem("mg_eventos_rol", datos.rol || "");
        sessionStorage.setItem("mg_eventos_permisos", JSON.stringify(datos.permisos || []));

        if (datos.expira) {
          sessionStorage.setItem("mg_eventos_expira", datos.expira);
        }

        if (!revalidacion) {
          mensaje.innerText = "Acceso autorizado. Preparando lector...";
        }

        return true;
      } catch (error) {
        console.error("Error validando sesión:", error);

        if (!revalidacion) {
          mensaje.innerText = "No fue posible verificar la sesión.";

          setTimeout(function() {
            limpiarSesion();
            window.location.replace(LOGIN_URL);
          }, 1500);

          return false;
        }

        return true;
      }
    }

    async function manejarSesionInvalida() {
      try {
        if (scanner) {
          await scanner.stop();
          scanner.clear();
          scanner = null;
        }
      } catch (error) {
        console.log("Error deteniendo lector:", error);
      }

      if (intervaloRevalidacion) {
        clearInterval(intervaloRevalidacion);
        intervaloRevalidacion = null;
      }

      limpiarSesion();
      window.location.replace(LOGIN_URL);
    }

    function iniciarRevalidacion() {
      if (intervaloRevalidacion) {
        clearInterval(intervaloRevalidacion);
      }

      intervaloRevalidacion = setInterval(async function() {
        console.log("Revalidando sesión...");
        await validarAcceso(true);
      }, INTERVALO_REVALIDACION);
    }

    function volverAlPanel() {
      window.location.href = PANEL_URL;
    }

    window.addEventListener("load", async function() {
      const accesoValido = await validarAcceso();

      if (!accesoValido) {
        return;
      }

      iniciarRevalidacion();

      const parametros = new URLSearchParams(window.location.search);

      if (parametros.get("lector") === "1") {
        setTimeout(function() {
          iniciarEscaner();
        }, 500);
      } else {
        document.getElementById("mensaje").innerText = "Presiona el botón para activar la cámara.";
      }
    });

    function hacerBeep() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 880;

        gainNode.gain.setValueAtTime(0.001, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.25, audioContext.currentTime + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.12);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.12);
      } catch (error) {
        console.log("No se pudo reproducir el sonido:", error);
      }
    }

    function generarScanId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return Date.now().toString(36) + "-" +
        Math.random().toString(36).substring(2) + "-" +
        Math.random().toString(36).substring(2);
    }

    async function iniciarEscaner() {
      const mensaje = document.getElementById("mensaje");

      if (procesando) {
        return;
      }

      mensaje.innerText = "Solicitando acceso a la cámara...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        stream.getTracks().forEach(track => track.stop());

        mensaje.innerText = "Inicializando cámara...";

        scanner = new Html5Qrcode("reader");

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("No se encontraron cámaras.");
        }

        let cameraId = cameras[0].id;

        const camaraTrasera = cameras.find(camera =>
          /back|rear|environment|trasera/i.test(camera.label)
        );

        if (camaraTrasera) {
          cameraId = camaraTrasera.id;
        }

        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          codigo => {
            if (procesando) {
              return;
            }

            procesando = true;
            hacerBeep();

            mensaje.innerText = "Ticket detectado. Validando...";

            const scanId = generarScanId();

            const url = API_URL +
              "?codigo=" + encodeURIComponent(codigo) +
              "&scanId=" + encodeURIComponent(scanId);

            window.location.href = url;
          },
          errorMessage => {
            // Los errores de búsqueda son normales mientras escanea.
          }
        );

        mensaje.innerText = "Cámara activa. Escanea el código QR.";
      } catch (error) {
        console.error(error);
        mensaje.innerText = "No fue posible activar la cámara.";
      }
    }

    async function detenerEscaner() {
      try {
        if (scanner) {
          await scanner.stop();
          scanner.clear();
          scanner = null;
          procesando = false;
          document.getElementById("mensaje").innerText = "Cámara detenida.";
        }
      } catch (error) {
        console.log(error);
      }
    }
  </script>

</body>
</html>
