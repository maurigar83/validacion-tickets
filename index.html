<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Validador de Tickets</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f4f6f8;
      color: #172b1d;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;

      background: white;

      border-radius: 22px;

      padding: 28px 20px 24px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.12);

      text-align: center;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 30px;
      line-height: 1.1;
    }

    .subtitulo {
      margin: 0 0 22px;

      color: #6b7280;

      font-size: 16px;
    }

    #reader {
      width: 100%;

      max-width: 420px;

      margin: 0 auto;

      overflow: hidden;

      border-radius: 16px;
    }

    .botones {
      margin-top: 20px;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    button {
      width: 100%;

      border: 0;

      border-radius: 12px;

      padding: 15px 18px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }

    #iniciar {
      background: #172b1d;
      color: white;
    }

    #detener {
      background: #e5e7eb;
      color: #172b1d;

      display: none;
    }

    #estado {
      margin-top: 18px;

      min-height: 24px;

      font-size: 15px;

      color: #6b7280;
    }

    .camera-selector {
      margin-top: 15px;

      display: none;
    }

    select {
      width: 100%;

      padding: 12px;

      border-radius: 10px;

      border: 1px solid #d1d5db;

      background: white;

      font-size: 16px;
    }

    .logo-texto {
      margin-bottom: 20px;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 1px;

      color: #6b7280;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .contenedor {
        padding: 24px 16px 20px;
      }

      h1 {
        font-size: 27px;
      }

    }

  </style>

</head>


<body>

  <main class="contenedor">

    <div class="logo-texto">
      VALIDACIÓN DE TICKETS
    </div>

    <h1>
      Escáner QR
    </h1>

    <p class="subtitulo">
      Escanea el código QR del ticket para validar el ingreso.
    </p>


    <div id="reader"></div>


    <div class="camera-selector">

      <select id="cameraSelect">

        <option value="">
          Selecciona una cámara
        </option>

      </select>

    </div>


    <div class="botones">

      <button
        id="iniciar"
        onclick="iniciarScanner()"
      >
        ESCANEAR TICKET
      </button>


      <button
        id="detener"
        onclick="detenerScanner()"
      >
        DETENER CÁMARA
      </button>

    </div>


    <div id="estado">
      Listo para escanear.
    </div>

  </main>


  <script>

    // =====================================================
    // API DE APPS SCRIPT — V2.6
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyxHCqVw6MQKsD6m_nVJXQwJWZqpQTSfpE5G9YnuOpE0MoaHXeeSu8sno9Fx-hY6EvBvg/exec";


    // =====================================================
    // CONFIGURACIÓN DEL LECTOR
    // =====================================================

    let html5QrCode = null;

    let camaras = [];

    let scannerActivo = false;

    let procesandoCodigo = false;


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const estado =
      document.getElementById("estado");

    const iniciar =
      document.getElementById("iniciar");

    const detener =
      document.getElementById("detener");

    const cameraSelector =
      document.querySelector(".camera-selector");

    const cameraSelect =
      document.getElementById("cameraSelect");


    // =====================================================
    // LISTAR CÁMARAS
    // =====================================================

    async function cargarCamaras() {

      try {

        camaras =
          await Html5Qrcode.getCameras();


        if (!camaras || camaras.length === 0) {

          estado.textContent =
            "No se encontró ninguna cámara.";

          return;

        }


        cameraSelect.innerHTML = "";


        camaras.forEach(
          (camera, indice) => {

            const option =
              document.createElement("option");

            option.value =
              camera.id;

            option.textContent =
              camera.label ||
              `Cámara ${indice + 1}`;

            cameraSelect.appendChild(
              option
            );

          }
        );


        cameraSelector.style.display =
          "block";


      } catch (error) {

        console.error(error);

        estado.textContent =
          "No fue posible acceder a las cámaras.";

      }

    }


    // =====================================================
    // INICIAR SCANNER
    // =====================================================

    async function iniciarScanner() {

      if (scannerActivo) {
        return;
      }


      procesandoCodigo = false;


      estado.textContent =
        "Iniciando cámara...";


      try {

        await cargarCamaras();


        if (!camaras || camaras.length === 0) {
          return;
        }


        let cameraId =
          cameraSelect.value;


        if (!cameraId) {

          cameraId =
            camaras[0].id;

        }


        html5QrCode =
          new Html5Qrcode("reader");


        await html5QrCode.start(

          cameraId,

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }

          },

          onScanSuccess,

          onScanFailure

        );


        scannerActivo = true;


        iniciar.style.display =
          "none";

        detener.style.display =
          "block";


        estado.textContent =
          "Escanea el código QR del ticket.";


      } catch (error) {

        console.error(error);

        scannerActivo = false;

        estado.textContent =
          "No fue posible iniciar la cámara.";

        iniciar.style.display =
          "block";

        detener.style.display =
          "none";

      }

    }


    // =====================================================
    // DETENER SCANNER
    // =====================================================

    async function detenerScanner() {

      if (!html5QrCode) {
        return;
      }


      try {

        if (scannerActivo) {

          await html5QrCode.stop();

        }


        await html5QrCode.clear();


      } catch (error) {

        console.error(error);

      }


      html5QrCode = null;

      scannerActivo = false;

      procesandoCodigo = false;


      iniciar.style.display =
        "block";

      detener.style.display =
        "none";


      estado.textContent =
        "Cámara detenida.";

    }


    // =====================================================
    // LECTURA EXITOSA
    // =====================================================

    function onScanSuccess(decodedText) {

      if (procesandoCodigo) {
        return;
      }


      procesandoCodigo = true;


      estado.textContent =
        "Ticket detectado. Validando...";


      // ---------------------------------------------------
      // DETENER CÁMARA
      // ---------------------------------------------------

      if (html5QrCode && scannerActivo) {

        html5QrCode
          .stop()
          .catch(error => {

            console.error(error);

          });

      }


      scannerActivo = false;


      // ---------------------------------------------------
      // ENVIAR CÓDIGO A APPS SCRIPT
      // ---------------------------------------------------

      const url =
        API_URL +
        "?codigo=" +
        encodeURIComponent(decodedText);


      window.top.location.href =
        url;

    }


    // =====================================================
    // LECTURA FALLIDA
    // =====================================================

    function onScanFailure(error) {

      // No hacemos nada.

      // html5-qrcode llama esta función
      // continuamente mientras busca un QR.

    }


    // =====================================================
    // CAMBIO DE CÁMARA
    // =====================================================

    cameraSelect.addEventListener(
      "change",
      async function () {

        if (!scannerActivo) {
          return;
        }


        await detenerScanner();

        await iniciarScanner();

      }
    );


    // =====================================================
    // ACTIVAR LECTOR SI VIENE ?lector=1
    // =====================================================

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    if (
      parametros.get("lector") === "1"
    ) {

      // El lector se abre normalmente
      // mediante el botón ESCANEAR TICKET.

      estado.textContent =
        "Listo para escanear.";

    }

  </script>

</body>

</html>
