<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Validación de Tickets</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 25px;
    }

    button {
      font-size: 18px;
      padding: 14px 24px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #btnStart {
      background: #198754;
      color: white;
    }

    #btnStop {
      background: #dc3545;
      color: white;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }

    #mensaje {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>VALIDACIÓN DE TICKETS</h1>

  <button id="btnStart" onclick="iniciarEscaner()">
    ESCANEAR TICKET
  </button>

  <button id="btnStop" onclick="detenerEscaner()">
    DETENER CÁMARA
  </button>

  <div id="reader"></div>

  <div id="mensaje">
    Presiona el botón para activar la cámara.
  </div>

  <script>

    // =====================================================
    // API V2.2
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyEXEtjQF9YCN7MJjE36qYVo5V9QWviqqatStAjcaEiEReZBFjwwn4wyaBcCnUe9CLC7w/exec";


    // =====================================================
    // VARIABLES
    // =====================================================

    let scanner = null;
    let procesando = false;

    let audioContext = null;


    // =====================================================
    // BEEP
    // =====================================================

    function hacerBeep() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }

        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }

        const oscillator =
          audioContext.createOscillator();

        const gainNode =
          audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value = 880;

        gainNode.gain.setValueAtTime(
          0.001,
          audioContext.currentTime
        );

        gainNode.gain.exponentialRampToValueAtTime(
          0.25,
          audioContext.currentTime + 0.01
        );

        gainNode.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.12
        );

        oscillator.connect(gainNode);

        gainNode.connect(
          audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + 0.12
        );

      } catch (error) {

        console.log(
          "No se pudo reproducir el sonido:",
          error
        );

      }

    }


    // =====================================================
    // INICIAR ESCÁNER
    // =====================================================

    async function iniciarEscaner() {

      const mensaje =
        document.getElementById("mensaje");

      if (procesando) return;

      mensaje.innerText =
        "Solicitando acceso a la cámara...";

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        stream
          .getTracks()
          .forEach(track => track.stop());


        mensaje.innerText =
          "Inicializando cámara...";


        scanner =
          new Html5Qrcode("reader");


        const cameras =
          await Html5Qrcode.getCameras();


        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "No se encontraron cámaras."
          );

        }


        let cameraId =
          cameras[0].id;


        const camaraTrasera =
          cameras.find(camera =>
            /back|rear|environment|trasera/i
              .test(camera.label)
          );


        if (camaraTrasera) {

          cameraId =
            camaraTrasera.id;

        }


        await scanner.start(

          cameraId,

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },


          codigo => {

            if (procesando) return;

            procesando = true;


            // UN SOLO BEEP
            hacerBeep();


            mensaje.innerText =
              "Ticket detectado. Validando...";


            const url =
              API_URL +
              "?codigo=" +
              encodeURIComponent(codigo);


            window.top.location.href =
              url;

          },


          errorMessage => {

            // Errores normales
            // mientras busca un QR.

          }

        );


        mensaje.innerText =
          "Cámara activa. Escanea el código QR.";


      } catch (error) {

        console.error(error);

        mensaje.innerText =
          "No fue posible activar la cámara.";

      }

    }


    // =====================================================
    // DETENER ESCÁNER
    // =====================================================

    async function detenerEscaner() {

      try {

        if (scanner) {

          await scanner.stop();

          scanner.clear();

          scanner = null;

        }

      } catch (error) {

        console.log(error);

      }

    }

  </script>

</body>
</html>
