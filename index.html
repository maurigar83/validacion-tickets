<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Tickets</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    button {
      margin: 10px 5px;
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #btnEscanear {
      background: #198754;
      color: white;
    }

    #btnDetener {
      background: #dc3545;
      color: white;
    }

    #estado {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Validación de Tickets</h1>

  <button id="btnEscanear">ESCANEAR TICKET</button>
  <button id="btnDetener">DETENER CÁMARA</button>

  <div id="estado">Cámara detenida</div>

  <div id="reader"></div>

  <script>
    // ============================================================
    // URL ACTUAL DE APPS SCRIPT — V2.4
    // ============================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbydW5xSz1wXJsYk_RHsYS6XuKEd8IanVIa3-ORcWnPY9lb4vjQlz8qS642SxumFR2CjCQ/exec";


    // ============================================================
    // CONFIGURACIÓN DEL LECTOR
    // ============================================================

    let scanner = null;
    let procesando = false;


    // ============================================================
    // ELEMENTOS
    // ============================================================

    const btnEscanear = document.getElementById("btnEscanear");
    const btnDetener = document.getElementById("btnDetener");
    const estado = document.getElementById("estado");


    // ============================================================
    // ESCANEAR
    // ============================================================

    btnEscanear.addEventListener("click", iniciarScanner);


    async function iniciarScanner() {

      if (scanner) {
        return;
      }

      procesando = false;

      estado.textContent = "Activando cámara...";

      try {

        // Pedir permiso explícitamente
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          }
        });

        // Apagar inmediatamente el stream de prueba.
        // html5-qrcode abrirá posteriormente la cámara.
        stream.getTracks().forEach(track => track.stop());


        scanner = new Html5Qrcode("reader");

        const devices = await Html5Qrcode.getCameras();

        if (!devices || devices.length === 0) {
          throw new Error("No se encontró ninguna cámara.");
        }


        // ========================================================
        // BUSCAR CÁMARA TRASERA
        // ========================================================

        let cameraId = devices[0].id;

        for (const device of devices) {

          const label = (device.label || "").toLowerCase();

          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("trasera")
          ) {
            cameraId = device.id;
            break;
          }
        }


        // ========================================================
        // INICIAR LECTOR
        // ========================================================

        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          onScanSuccess,
          onScanFailure
        );

        estado.textContent = "Cámara activa — escanee el ticket";

      } catch (error) {

        console.error(error);

        scanner = null;

        estado.textContent =
          "No se pudo activar la cámara. Verifique los permisos.";

      }
    }


    // ============================================================
    // QR DETECTADO
    // ============================================================

    async function onScanSuccess(decodedText) {

      if (procesando) {
        return;
      }

      procesando = true;

      console.log("QR detectado:", decodedText);

      try {

        // Detener cámara antes de enviar la validación
        await detenerScanner();

      } catch (error) {

        console.error("Error deteniendo cámara:", error);

      }


      // ==========================================================
      // ENVIAR QR A APPS SCRIPT
      // ==========================================================

      const url =
        API_URL +
        "?codigo=" +
        encodeURIComponent(decodedText);

      console.log("Enviando a:", url);

      window.top.location.href = url;
    }


    // ============================================================
    // FALLA DE LECTURA
    // ============================================================

    function onScanFailure(error) {
      // No hacer nada.
      // html5-qrcode intenta nuevamente automáticamente.
    }


    // ============================================================
    // DETENER CÁMARA
    // ============================================================

    btnDetener.addEventListener("click", detenerScanner);


    async function detenerScanner() {

      if (!scanner) {
        return;
      }

      try {

        await scanner.stop();

      } catch (error) {

        console.error("Error al detener scanner:", error);

      }

      try {

        scanner.clear();

      } catch (error) {

        console.error("Error limpiando scanner:", error);

      }

      scanner = null;

      estado.textContent = "Cámara detenida";
    }

  </script>

</body>
</html>
